version: "3.8"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: mlops_mlflow_server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////mlflow/mlflow.db
    volumes:
      - mlflow_data:/mlflow
      - ../mlartifacts:/mlartifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlartifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mlops_pipeline_runner
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=retinopathy_classifier_experiment
      - MLFLOW_MODEL_NAME=retinopathy_classifier
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../configs:/app/configs
    command: ["--config", "configs/config.yaml"]

volumes:
  mlflow_data:
    driver: local
